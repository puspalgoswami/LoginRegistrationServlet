<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            margin: 0; min-height: 100vh; display: flex;
            justify-content: center; align-items: center;
            background: linear-gradient(135deg, #6666cc, #6f55b8);
        }
        .container {
            width: 88%; max-width: 1100px; padding: 85px 80px;
            background: white; border-radius: 28px;
            box-shadow: 0 8px 25px rgba(0,0,0,.25);
        }
        h1 {
            text-align: center; color: #4b0082;
            font-size: 50px; margin: 0 0 60px;
        }
        .row { display: flex; align-items: center; margin: 25px 0; }
        label { width: 34%; font-size: 30px; font-weight: bold; }
        input[type="text"], input[type="password"] {
            width: 52%; height: 68px; border: 2px solid #aaa;
            border-radius: 12px; font-size: 26px; padding: 10px 16px;
        }
        .button-row { justify-content: center; margin-top: 45px; }
        input[type="submit"] {
            background: #5b14b5; color: white; border: none;
            border-radius: 12px; padding: 18px 70px;
            font-size: 28px; cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔐 Login</h1>
    <form action="LoginServlet" method="post">
        <div class="row">
            <label>User ID:</label>
            <input type="text" name="username" required>
        </div>
        <div class="row">
            <label>Password:</label>
            <input type="password" name="password" required>
        </div>
        <div class="row button-row">
            <input type="submit" value="Login">
        </div>
    </form>
    <p style="text-align:center;font-size:20px;">
        New student? <a href="registration.html">Register here</a>
    </p>
</div>
</body>
</html>
